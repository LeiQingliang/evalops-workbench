[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalops-workbench"
version = "0.1.0"
description = "Offline answer quality operations: deterministic checks, case-level regression, and review reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LeiQingliang"}]
dependencies = []

[project.scripts]
evalops = "evalops.__main__:main"

[tool.setuptools.packages.find]
include = ["evalops*"]

[tool.setuptools.package-data]
evalops = ["data/*.csv"]
